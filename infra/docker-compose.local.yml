# =============================================================================
#  Bürokratie-Copilot — локальный запуск прод-стека (без домена и без MinIO)
# =============================================================================
#  Зачем: на этой машине нет ни образов MinIO (убраны из Docker Hub), ни сборки
#  ClamAV под arm64, и нет домена — TLS выпущен самоподписанным.
#
#  Что меняет (только environment и порты — никаких Compose-расширений вроде
#  !override, чтобы файл оставался обычным YAML и проверялся в CI):
#    * хранение файлов на локальном диске (BC_STORAGE_TYPE=local-fs — это и есть
#      значение по умолчанию в application.yml, MinIO не обязателен);
#    * антивирус выключен осознанно: файл помечается «не проверен», НИКОГДА «чистый»;
#    * порт web наружу, потому что TLS-вход доступен только с сертификатом домена.
#
#  Запуск — сервисы перечислены явно, а --no-deps не даёт подтянуть minio и clamav:
#    docker compose --env-file infra/.env \
#      -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#      -f infra/docker-compose.local.yml \
#      up -d --no-deps postgres api worker web
#    docker compose ... --profile proxy up -d --no-deps proxy
#
#  ВАЖНО: api и worker обязаны смотреть в один том данных (api-data) — при
#  локальном хранении это один каталог, иначе загруженный файл не виден конвейеру.
services:
  api:
    environment:
      BC_STORAGE_TYPE: local-fs
      BC_MALWARE_SCANNER: none
      # Осознанное решение для стенда: ClamAV под arm64 не собирается.
      BC_ALLOW_UNSCANNED: "true"
      # Детали health, чтобы DOWN называл компонент, а не оставлял гадать.
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
  worker:
    environment:
      BC_STORAGE_TYPE: local-fs
      BC_MALWARE_SCANNER: none
      BC_ALLOW_UNSCANNED: "true"
  web:
    ports:
      - "127.0.0.1:3000:3000"
