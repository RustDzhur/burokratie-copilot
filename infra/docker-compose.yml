# =============================================================================
#  Bürokratie-Copilot — development stack (Docker Compose)
# =============================================================================
#  Usage:
#      cp infra/.env.example infra/.env      # then edit the placeholders
#      docker compose --env-file infra/.env -f infra/docker-compose.yml up -d
#      docker compose --env-file infra/.env -f infra/docker-compose.yml ps
#      docker compose --env-file infra/.env -f infra/docker-compose.yml logs -f api
#
#  Requirements: Docker Engine 24+ with Compose v2.20+ (`docker compose`, not the
#  retired `docker-compose` v1 — this file relies on `depends_on.condition`,
#  `!reset`/`!override` tags in the production override and healthcheck gating).
#
#  Security posture of THIS file (development only):
#    * every published port is bound to ${BC_BIND_ADDRESS:-127.0.0.1}, so nothing
#      is reachable from the LAN by default;
#    * the database and object-storage credentials are placeholder values taken
#      from infra/.env — never reused for production;
#    * secrets are passed as environment variables, never baked into images.
#  Production uses the override file:
#      docker compose --env-file infra/.env \
#        -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#  See docs/deployment.md and docs/runbook.md.
#
#  NOT EXECUTED IN THE AUTHORING ENVIRONMENT: Docker is not installed on the
#  machine where this file was written. It is validated statically (YAML parse
#  plus `docker compose config` in CI when a Docker daemon is available) — see
#  docs/runbook.md → "Verification status".
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}

# -----------------------------------------------------------------------------
# Reusable fragments
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-image: &api-image
  build:
    # Build context is the REPOSITORY ROOT (not infra/) so that the backend
    # sources and the Maven wrapper can be copied into the build stage.
    context: ..
    dockerfile: infra/docker/api.Dockerfile
    args:
      # Recorded in the image as an OCI label; used for release traceability.
      BUILD_REVISION: ${BC_BUILD_REVISION:-unknown}

# Environment shared by `api` and `worker` — they run the SAME artifact, only
# the Spring profile differs (spec §2.1: worker components of the modular
# monolith, scaled independently).
x-api-environment: &api-environment
  # --- database ---
  BC_DB_HOST: postgres
  BC_DB_PORT: "5432"
  BC_DB_NAME: ${POSTGRES_DB:-burokratie}
  BC_DB_USER: ${POSTGRES_USER:-burokratie}
  BC_DB_PASSWORD: ${BC_DB_PASSWORD:?BC_DB_PASSWORD must be set in infra/.env}
  BC_DB_POOL_SIZE: ${BC_DB_POOL_SIZE:-10}
  # Controlled migrations: keep true in dev, gate in production (docs/runbook.md).
  BC_FLYWAY_ENABLED: ${BC_FLYWAY_ENABLED:-true}
  # --- object storage ---
  BC_STORAGE_TYPE: ${BC_STORAGE_TYPE:-s3}
  BC_STORAGE_PATH: ${BC_STORAGE_PATH:-/app/data/blobs}
  BC_S3_ENDPOINT: ${BC_S3_ENDPOINT:-http://minio:9000}
  BC_S3_REGION: ${BC_S3_REGION:-eu-central-1}
  BC_S3_BUCKET: ${BC_S3_BUCKET:-burokratie}
  BC_S3_ACCESS_KEY: ${BC_S3_ACCESS_KEY:?BC_S3_ACCESS_KEY must be set in infra/.env}
  BC_S3_SECRET_KEY: ${BC_S3_SECRET_KEY:?BC_S3_SECRET_KEY must be set in infra/.env}
  # --- security ---
  # Must be base64 of exactly 32 bytes. The `prod` profile refuses to start
  # without it; in dev a placeholder keeps the boot path identical.
  BC_ENCRYPTION_KEY: ${BC_ENCRYPTION_KEY:?BC_ENCRYPTION_KEY must be set in infra/.env}
  BC_PUBLIC_BASE_URL: ${BC_PUBLIC_BASE_URL:-http://localhost:3000}
  BC_COOKIE_SECURE: ${BC_COOKIE_SECURE:-false}
  # --- limits / runtime ---
  BC_MAX_UPLOAD_SIZE: ${BC_MAX_UPLOAD_SIZE:-100MB}
  BC_MAX_REQUEST_SIZE: ${BC_MAX_REQUEST_SIZE:-250MB}
  # --- optional features: DISABLED unless credentials exist (spec §9.2, §10.1) ---
  BC_AI_ENABLED: ${BC_AI_ENABLED:-false}
  BC_AI_PROVIDER: ${BC_AI_PROVIDER:-none}
  BC_AI_BASE_URL: ${BC_AI_BASE_URL:-}
  BC_AI_API_KEY: ${BC_AI_API_KEY:-}
  BC_AI_MONTHLY_BUDGET_EUR: ${BC_AI_MONTHLY_BUDGET_EUR:-0}
  BC_REGISTRATION_OPEN: ${BC_REGISTRATION_OPEN:-true}
  BC_OCR_ENABLED: ${BC_OCR_ENABLED:-true}
  BC_MALWARE_SCANNER: ${BC_MALWARE_SCANNER:-clamav-cli}
  BC_CLAMAV_PATH: ${BC_CLAMAV_PATH:-clamscan}
  BC_MALWARE_SCAN_SPOOL: ${BC_MALWARE_SCAN_SPOOL:-/app/data/scan-spool}
  BC_MALWARE_SCAN_TIMEOUT: ${BC_MALWARE_SCAN_TIMEOUT:-PT2M}
  BC_OCR_ENGINE: ${BC_OCR_ENGINE:-tesseract}
  BC_OCR_LANGUAGES: ${BC_OCR_LANGUAGES:-deu+eng}
  BC_TESSERACT_PATH: ${BC_TESSERACT_PATH:-tesseract}
  # --- outbound mail ---
  # Spring Boot's own namespace: this is what DefaultEmailSender actually reads.
  # Without SPRING_MAIL_HOST no mail is sent at all (the body is logged instead)
  # and e-mail verification — required for registration — cannot complete.
  SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
  SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
  SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
  SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
  # Without these the connection is plain text and Gmail and most relays refuse it (530 Must issue a STARTTLS).
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
  BC_MAIL_FROM: ${BC_MAIL_FROM:-no-reply@buerokratie-copilot.local}
  # --- observability ---
  BC_LOG_LEVEL: ${BC_LOG_LEVEL:-INFO}
  # --- logging / timezone ---
  TZ: ${TZ:-Europe/Berlin}

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 — primary datastore (spec §2.1)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: bc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burokratie}
      POSTGRES_USER: ${POSTGRES_USER:-burokratie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      # Sensible defaults for a containerised instance; the server timezone is
      # pinned so that `timestamp with time zone` handling is reproducible.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C.UTF-8"
      TZ: ${TZ:-Europe/Berlin}
    command:
      - postgres
      - -c
      - max_connections=${BC_DB_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${BC_DB_SHARED_BUFFERS:-256MB}
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=${BC_DB_LOG_SLOW_MS:-1000}
    ports:
      # Development convenience only (psql/backup scripts from the host).
      - "${BC_BIND_ADDRESS:-127.0.0.1}:${BC_DB_PORT_PUBLISHED:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-U` must be the superuser defined above; `-d` explicitly selects the app DB.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for blobs (spec §2.1, §30)
  # ---------------------------------------------------------------------------
  minio:
    # The upstream minio/* images on Docker Hub are no longer published: point these at an image you build or mirror.
    image: ${BC_MINIO_IMAGE:-minio/minio:latest}
    container_name: bc-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in infra/.env}
      # Restrict the browser console to the local workstation in dev.
      MINIO_BROWSER_REDIRECT_URL: ${BC_MINIO_CONSOLE_URL:-http://localhost:9001}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # S3 API — needed by the host-side backup script (mc/aws cli).
      - "${BC_BIND_ADDRESS:-127.0.0.1}:${BC_S3_PORT_PUBLISHED:-9000}:9000"
      # Web console — development only; never published in production.
      - "${BC_BIND_ADDRESS:-127.0.0.1}:${BC_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # minio-init — one-shot bucket bootstrap
  # ---------------------------------------------------------------------------
  # Creates the bucket and (in dev) a dedicated access key, then exits 0. The
  # application does NOT create buckets itself, so api/worker wait for this job
  # to complete successfully.
  minio-init:
    image: ${BC_MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: bc-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in infra/.env}
      BC_S3_BUCKET: ${BC_S3_BUCKET:-burokratie}
      BC_S3_ACCESS_KEY: ${BC_S3_ACCESS_KEY:?BC_S3_ACCESS_KEY must be set in infra/.env}
      BC_S3_SECRET_KEY: ${BC_S3_SECRET_KEY:?BC_S3_SECRET_KEY must be set in infra/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Wait until the S3 API really answers (the healthcheck covers the
        # liveness endpoint; this covers readiness of the S3 handler).
        i=0
        until mc alias set local "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -gt 60 ]; then echo "minio-init: MinIO did not become ready" >&2; exit 1; fi
          sleep 2
        done
        # Idempotent: `mb --ignore-existing` never fails when the bucket exists.
        mc mb --ignore-existing "local/$$BC_S3_BUCKET"
        # Keep bucket contents private (spec §21.1 — no anonymous object access).
        mc anonymous set none "local/$$BC_S3_BUCKET" >/dev/null 2>&1 || true
        # Create the application access key only when it differs from root.
        if [ "$$BC_S3_ACCESS_KEY" != "$$MINIO_ROOT_USER" ] || [ "$$BC_S3_SECRET_KEY" != "$$MINIO_ROOT_PASSWORD" ]; then
          mc admin user add local "$$BC_S3_ACCESS_KEY" "$$BC_S3_SECRET_KEY" >/dev/null 2>&1 || true
          cat > /tmp/bc-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::$$BC_S3_BUCKET"]},{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::$$BC_S3_BUCKET/*"]}]}
        EOF
          mc admin policy create local bc-app /tmp/bc-policy.json >/dev/null 2>&1 || true
          mc admin policy attach local bc-app --user "$$BC_S3_ACCESS_KEY" >/dev/null 2>&1 || true
          rm -f /tmp/bc-policy.json
        fi
        mc ls "local/$$BC_S3_BUCKET" >/dev/null
        echo "minio-init: bucket '$$BC_S3_BUCKET' is ready"
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # api — HTTP backend (Spring Boot, profile `dev`)
  # ---------------------------------------------------------------------------
  api:
    <<: *api-image
    image: ${BC_REGISTRY:-burokratie-local}/api:${BC_IMAGE_TAG:-local}
    container_name: bc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The bucket must exist before the first upload; the application itself
      # never creates buckets.
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SPRING_PROFILES_ACTIVE: ${BC_SPRING_PROFILE_API:-dev}
      BC_PORT: "8080"
      # Container-aware heap sizing; override BC_JAVA_OPTS for tuning.
      JAVA_OPTS: ${BC_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom}
    ports:
      - "${BC_BIND_ADDRESS:-127.0.0.1}:${BC_API_PORT:-8080}:8080"
    volumes:
      # Only needed for BC_STORAGE_TYPE=local-fs; harmless with S3/MinIO.
      - api-data:/app/data
    tmpfs:
      # The application writes temp files while streaming uploads. With a
      # read-only root filesystem (prod) this must be a tmpfs, not image storage.
      - /tmp:mode=1777,size=256m
    healthcheck:
      # Uses the readiness probe, which includes the database and disk checks.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    stop_grace_period: 45s
    networks:
      - internal
      - edge
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # worker — same image, background profile (no HTTP API)
  # ---------------------------------------------------------------------------
  worker:
    <<: *api-image
    image: ${BC_REGISTRY:-burokratie-local}/api:${BC_IMAGE_TAG:-local}
    container_name: bc-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SPRING_PROFILES_ACTIVE: worker
      # Management/health port for a process that serves no application traffic.
      BC_WORKER_MANAGEMENT_PORT: "8081"
      BC_WORKER_CONCURRENCY: ${BC_WORKER_CONCURRENCY:-4}
      JAVA_OPTS: ${BC_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom}
    # No published ports: the worker must not be reachable from outside.
    volumes:
      - worker-data:/app/data
    tmpfs:
      - /tmp:mode=1777,size=256m
    healthcheck:
      # The worker serves no traffic, so the health GROUP is the right probe: it
      # aggregates liveness + readiness and every registered health indicator
      # (database, disk space, ...) and turns DOWN when a required dependency is
      # gone — a plain liveness probe would keep reporting UP.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 60s
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # web — Next.js frontend (standalone output)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD time,
        # which is why this is a build arg and not only a runtime variable.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        BC_API_ORIGIN: ${BC_API_ORIGIN:-http://api:8080}
        BUILD_REVISION: ${BC_BUILD_REVISION:-unknown}
    image: ${BC_REGISTRY:-burokratie-local}/web:${BC_IMAGE_TAG:-local}
    container_name: bc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The image contains a PRODUCTION build of the Next.js app, so NODE_ENV
      # must stay `production` even in the dev stack — `development` would make
      # Next.js refuse to serve the optimised output. Use `pnpm dev` on the host
      # (see README.md) when you need hot reload.
      NODE_ENV: production
      PORT: "3000"
      # Bind to all interfaces INSIDE the container; the published mapping below
      # is what restricts host exposure.
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${BC_BIND_ADDRESS:-127.0.0.1}:${BC_WEB_PORT:-3000}:3000"
    tmpfs:
      - /tmp:mode=1777,size=128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 20s
    networks:
      - edge
    logging: *default-logging

# -----------------------------------------------------------------------------
# Networks — the frontend is the only service on `edge`; the datastore, object
# storage and worker stay on the private `internal` network (spec §21).
# -----------------------------------------------------------------------------
networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-internal
    driver: bridge
  edge:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-edge
    driver: bridge

# -----------------------------------------------------------------------------
# Named volumes — data survives `docker compose down`; `down -v` removes it.
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-postgres-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-minio-data
  api-data:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-api-data
  worker-data:
    name: ${COMPOSE_PROJECT_NAME:-burokratie-copilot}-worker-data
