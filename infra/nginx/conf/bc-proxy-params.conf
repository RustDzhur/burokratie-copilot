# =============================================================================
#  Shared proxy parameters (NOT a template — plain include)
# =============================================================================
#  Included by every `location` block in 20-server.conf. Kept in one place so a
#  security-relevant header cannot be forgotten in a single route.
#
#  Forwarded headers: the backend runs with
#  `server.forward-headers-strategy: framework` and, in the `prod` profile, with
#  `server.tomcat.remoteip.remote-ip-header=X-Forwarded-For` /
#  `protocol-header=X-Forwarded-Proto` — so it builds correct absolute URLs and
#  marks cookies `Secure` based on these values. Do not strip them.
# =============================================================================

proxy_http_version 1.1;

# Pass the original Host so the application can validate it (and so that
# absolute URLs and CSRF/Origin checks see the public name, not `api:8080`).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $bc_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / HTTP upgrade support (Next.js HMR in staging, SSE endpoints).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Do not leak backend error pages / server signature to the client.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# Retry once against the same upstream on a stale keep-alive connection.
proxy_next_upstream error timeout http_502 http_503 http_504;
