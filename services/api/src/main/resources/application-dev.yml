# Local development profile.
#
# Defaults target a local PostgreSQL 17 instance (see README.md). Never put real
# credentials in this file — everything is read from environment variables with
# development-only fallbacks in application.yml.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    de.buerokratiecopilot: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: always
