# =============================================================================
#  Firmspace Robots Runtime — API-only installation profile
# =============================================================================
#  This profile serves the agent runtime, workflow engine, document ingest,
#  exports, identity (API tokens and the owner identity) and settings as an API.
#  There is no Copilot web UI in this installation: the compose file starts
#  PostgreSQL and the API only.
#
#  The profile is intentionally not named `prod`: a runtime installation has no
#  browser session, no SMTP relay and no operator frontend, so the production
#  guard's requirements would be the wrong requirements. The runtime has its own
#  guard (RuntimeConfigurationGuard) for the protections it does need.
#
#  Every value below is environment-driven; docker-compose.runtime.yml and the
#  installer supply them.
# =============================================================================

spring:
  flyway:
    enabled: ${BC_FLYWAY_ENABLED:true}
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${BC_MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${BC_MAX_REQUEST_SIZE:250MB}

server:
  port: ${BC_PORT:8080}
  forward-headers-strategy: framework

# The API description is for the vendor and for integration work; it is not a
# product screen and is off by default. Set BC_API_DOCS_ENABLED=true to expose
# /api-docs on a trusted network.
springdoc:
  api-docs:
    enabled: ${BC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    de.buerokratiecopilot: ${BC_LOG_LEVEL:INFO}

burokratie:
  runtime:
    enabled: true
    # Generated by scripts/install-runtime.sh. Empty disables bootstrap and token
    # administration; the API still starts, because an existing installation must
    # not become unreachable when this value is rotated.
    admin-token: ${BC_RUNTIME_ADMIN_TOKEN:}
  license:
    enforced: ${BC_LICENSE_ENFORCEMENT:true}
    key: ${LICENSE_KEY:}
    key-file: ${LICENSE_KEY_FILE:}
    secret: ${LICENSE_SECRET:}
    instance-id-file: ${BC_INSTANCE_ID_FILE:/app/data/instance-id}
    grace-days: ${LICENSE_GRACE_DAYS:14}
    # Public licence-status endpoint of the vendor cabinet. Empty disables the revocation check:
    # the installation then trusts the signed key only. A key without expiresAt is perpetual.
    check-url: ${LICENSE_CHECK_URL:}
    # Last known revocation answer; needed so a restart during a cabinet outage does not
    # silently un-revoke the installation.
    state-file: ${LICENSE_STATE_FILE:/app/data/license-state.json}
  security:
    # Token-only access: the owner identity exists for audit and token ownership,
    # not for a password login. There is no UI to register through.
    registration-open: ${BC_REGISTRATION_OPEN:false}
    require-terms-acceptance: false
    public-base-url: ${BC_PUBLIC_BASE_URL:http://localhost:8080}
    session:
      cookie-secure: ${BC_COOKIE_SECURE:false}
    malware-scanner:
      # The runtime image contains the clamdscan client but no clamd daemon by
      # default (see docs/deployment/RUNTIME.md). The operator can point it at a
      # scanner or accept the gap explicitly.
      type: ${BC_MALWARE_SCANNER:none}
  storage:
    type: ${BC_STORAGE_TYPE:local-fs}
    local:
      base-path: ${BC_STORAGE_PATH:/app/data/blobs}
  ocr:
    # The runtime image ships tesseract with deu/eng/rus/ukr traineddata.
    enabled: ${BC_OCR_ENABLED:true}
    engine: ${BC_OCR_ENGINE:tesseract}
    languages: ${BC_OCR_LANGUAGES:deu+eng}
    tesseract-path: ${BC_TESSERACT_PATH:tesseract}
  ai:
    enabled: ${BC_AI_ENABLED:false}
  telegram:
    # No Telegram informer in the runtime unless an operator deliberately enables it.
    poll-enabled: ${BC_TELEGRAM_POLL:false}
