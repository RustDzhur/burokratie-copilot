# German messages (primary language, spec §24).
# Keys are referenced by ErrorCode and by the frontend through /api/v1 error codes.

error.validation=Die übermittelten Daten sind ungültig.
error.invalid_request=Die Anfrage ist ungültig.
error.malformed_body=Die Anfrage konnte nicht gelesen werden.
error.unauthenticated=Anmeldung erforderlich.
error.session_expired=Ihre Sitzung ist abgelaufen. Bitte melden Sie sich erneut an.
error.mfa_required=Zur Bestätigung ist ein zweiter Faktor erforderlich.
